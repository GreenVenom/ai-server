schema_version: 1

collection:
  name: obsidian_chunks_v2
  payload_schema_version: 2

embedding:
  model: nomic-embed-text:latest
  vector_name: text-dense
  dimension: 768
  distance: Cosine

discovery:
  include_extensions:
    - .md
  exclude_directories:
    - .obsidian
    - .trash
    - templates
  exclude_patterns:
    - "*.excalidraw.md"
  follow_symlinks: false

index_control:
  default_include: true
  exclusion_field: ai_exclude
  inclusion_field: ai_index

chunking:
  profile: heading-aware-v1
  target_tokens: 700
  maximum_tokens: 1200
  overlap_tokens: 100
  minimum_tokens: 40

safety:
  maximum_automatic_deletion_percent: 10
  require_completed_sync: true
  prevent_overlapping_runs: true
