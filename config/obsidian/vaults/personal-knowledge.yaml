schema_version: 1

vault:
  id: personal-knowledge
  display_name: Personal Knowledge Vault

mirror:
  path: /Users/openclaw/server/data/obsidian/vaults/personal-knowledge
  mode: read_only
  authoritative: false

index:
  collection: obsidian_chunks_v2
  manifest: /Users/openclaw/server/data/obsidian/manifests-v2/personal-knowledge.json
  incremental: true

retrieval:
  enabled: true
  maximum_results: 8
  default_score_threshold: 0.35

safety:
  maximum_delete_percent: 10
  require_override_for_large_delete: true
